server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: root
    password: 1234
    url: jdbc:mysql://127.0.0.1:3306/ragent?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      #password: 123456

milvus:
  uri: http://localhost:19530

rag:
  default:
    collection-name: rag_default_store
    dimension: 1024
    image-dimension: 1024
    image-collection-suffix: _images
    visual-answer-model: qwen3-vl-8b-thinking
    visual-answer-image-limit: 4
    metric-type: COSINE

  document-analysis:
    enabled: true
    auto-detect: true
    fallback-to-tika-on-error: true
    provider: ${PADDLE_PROVIDER:bridge}
    request-mode: ${PADDLE_REQUEST_MODE:sync}
    api-key: ${PADDLE_API_KEY:}
    base-url: ${PADDLE_BRIDGE_BASE_URL:http://127.0.0.1:8099}
    endpoint: ${PADDLE_BRIDGE_ENDPOINT:/v1/document-analysis}
    sync-url: ${PADDLE_SYNC_URL:https://z9y7xan5l6yevav5.aistudio-app.com/layout-parsing}
    async-job-url: ${PADDLE_ASYNC_JOB_URL:https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
    model: ${PADDLE_MODEL:PaddleOCR-VL-1.5-0.9B}
    default-mode: ${PADDLE_DEFAULT_MODE:paddleocr_vl_1_5}
    fallback-mode: ${PADDLE_FALLBACK_MODE:pp_structure_v3}
    async-poll-interval-ms: ${PADDLE_ASYNC_POLL_INTERVAL_MS:5000}
    async-timeout-ms: ${PADDLE_ASYNC_TIMEOUT_MS:600000}
    async-max-concurrent-jobs: ${PADDLE_ASYNC_MAX_CONCURRENT_JOBS:2}
    async-submit-max-attempts: ${PADDLE_ASYNC_SUBMIT_MAX_ATTEMPTS:3}
    async-submit-retry-initial-delay-ms: ${PADDLE_ASYNC_SUBMIT_RETRY_INITIAL_DELAY_MS:3000}
    async-submit-retry-max-delay-ms: ${PADDLE_ASYNC_SUBMIT_RETRY_MAX_DELAY_MS:30000}
    result-download-dir: ${PADDLE_RESULT_DOWNLOAD_DIR:scripts/paddle_api_runtime}
    download-remote-images: ${PADDLE_DOWNLOAD_REMOTE_IMAGES:true}
    use-doc-orientation-classify: ${PADDLE_USE_DOC_ORIENTATION_CLASSIFY:false}
    use-doc-unwarping: ${PADDLE_USE_DOC_UNWARPING:false}
    use-chart-recognition: ${PADDLE_USE_CHART_RECOGNITION:false}
    auto-mime-types:
      - PDF
      - IMAGE

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        supplement-intent-directed: true
        top-k-multiplier: 3
      visual-global:
        enabled: true
        top-k-multiplier: 2
        embedding-model: qwen3-vl-embedding-2b-local
        rerank-model: qwen3-vl-rerank-local
      intent-directed-visual:
        enabled: true
        top-k-multiplier: 2
        embedding-model: qwen3-vl-embedding-2b-local
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: ${OLLAMA_BASE_URL:http://localhost:11434}
      keep-alive: ${OLLAMA_KEEP_ALIVE:30s}
      endpoints:
        chat: /api/chat
        embedding: /api/embed
        rerank: /api/generate
    local-vl:
      url: ${LOCAL_VL_EMBEDDING_URL:http://127.0.0.1:8115}
      api-key: ${LOCAL_VL_EMBEDDING_API_KEY:}
      endpoints:
        embedding: ${LOCAL_VL_EMBEDDING_ENDPOINT:/v1/embeddings}
    local-hf:
      url: ${LOCAL_HF_EMBEDDING_URL:http://127.0.0.1:8125}
      api-key: ${LOCAL_HF_API_KEY:}
      endpoints:
        embedding: ${LOCAL_HF_EMBEDDING_ENDPOINT:/v1/embeddings}
        rerank: ${LOCAL_HF_RERANK_ENDPOINT:/v1/rerank}
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-5-local-main
    deep-thinking-model: qwen3-5-local-main
    candidates:
      - id: qwen3-5-local-main
        provider: ollama
        model: ${QWEN_CHAT_MAIN_MODEL:qwen3.5:9b}
        supports-thinking: true
        priority: 0
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 20
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 30
      - id: qwen3-vl-8b-thinking
        provider: bailian
        model: qwen3-vl-8b-thinking
        supports-thinking: true
        supports-multimodal: true
        priority: 31
      - id: qwen3-local
        provider: ollama
        model: ${QWEN_CHAT_QUALITY_MODEL:qwen3-local8b:latest}
        supports-thinking: true
        priority: 1
      - id: qwen3-local-fast
        provider: ollama
        model: ${QWEN_CHAT_FAST_MODEL:qwen3-local8b:latest}
        supports-thinking: true
        priority: 2
      - id: llama3-1-local
        provider: ollama
        model: llama3.1:8b
        priority: 10

  embedding:
    default-model: qwen-emb-local-small
    candidates:
      - id: qwen-emb-local-small
        provider: local-hf
        model: ${QWEN_TEXT_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
        dimension: 1024
        priority: 0
      - id: qwen3-vl-embedding-2b-local
        provider: local-vl
        model: ${QWEN_VL_EMBEDDING_MODEL:Qwen/Qwen3-VL-Embedding-2B}
        dimension: 1024
        priority: 1
      - id: qwen3-vl-embedding-2b-ollama
        provider: ollama
        model: ${QWEN_VL_EMBEDDING_OLLAMA_MODEL:aksh-desai/qwen3-vl-embedding:2b-q8_0}
        dimension: 2048
        priority: 10
        enabled: ${ENABLE_QWEN_VL_EMBEDDING_OLLAMA:false}
      - id: qwen3-vl-embedding-1024
        provider: bailian
        model: qwen3-vl-embedding
        url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
        dimension: 1024
        priority: 20
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: 4096
        priority: 40
        enabled: ${ENABLE_QWEN_EMB_LOCAL_8B:false}

  rerank:
    default-model: qwen3-rerank-hf-small
    candidates:
      - id: qwen3-rerank-hf-small
        provider: local-hf
        model: ${QWEN_TEXT_RERANK_MODEL:Qwen/Qwen3-Reranker-0.6B}
        url: ${LOCAL_HF_RERANK_URL:http://127.0.0.1:8126/v1/rerank}
        priority: 0
      - id: qwen3-vl-rerank-local
        provider: local-hf
        model: ${QWEN_VL_RERANK_MODEL:Qwen/Qwen3-VL-Reranker-2B}
        url: ${LOCAL_HF_RERANK_URL:http://127.0.0.1:8126/v1/rerank}
        priority: 5
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 20
        enabled: ${ENABLE_BAILIAN_RERANK:false}
      - id: qwen3-vl-rerank
        provider: bailian
        model: qwen3-vl-rerank
        priority: 30
        enabled: ${ENABLE_BAILIAN_RERANK:false}
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
